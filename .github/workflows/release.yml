name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android-Plattform 37 installieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Release-APK bauen
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "Fembiond-${GITHUB_REF_NAME}.apk"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: Fembiond ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: Fembiond-${{ github.ref_name }}.apk
